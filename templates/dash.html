<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate Wellness Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babel-standalone@7.22.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const WellnessDashboard = () => {
      const [user, setUser] = React.useState({
        name: "John Doe",
        healthScore: 85,
        steps: 7500,
        recentSymptoms: ["Mild headache", "Fatigue"],
        challenges: ["Step Challenge: 10,000 steps/day", "Mindfulness: 5 min/day"],
      });

      const handleSymptomCheck = () => {
        alert("Redirecting to Symptom Checker...");
        // Integrate with existing symptom checker API
      };

      const handleBookDoctor = () => {
        alert("Redirecting to Telemedicine Booking...");
        // Integrate with telemedicine API
      };

      return (
        <div className="min-h-screen bg-gray-100 p-6">
          <header className="bg-blue-600 text-white p-4 rounded-lg mb-6">
            <h1 className="text-2xl font-bold">Welcome, {user.name}!</h1>
            <p>Your Health Score: <span className="font-semibold">{user.healthScore}/100</span></p>
          </header>
          
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* Health Summary */}
            <div className="bg-white p-4 rounded-lg shadow">
              <h2 className="text-xl font-semibold mb-2">Health Summary</h2>
              <p>Recent Symptoms: {user.recentSymptoms.join(", ")}</p>
              <p>Steps Today: {user.steps}/10,000</p>
              <button 
                onClick={handleSymptomCheck}
                className="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
              >
                Check Symptoms
              </button>
            </div>

            {/* Wellness Challenges */}
            <div className="bg-white p-4 rounded-lg shadow">
              <h2 className="text-xl font-semibold mb-2">Active Challenges</h2>
              <ul className="list-disc pl-5">
                {user.challenges.map((challenge, index) => (
                  <li key={index}>{challenge}</li>
                ))}
              </ul>
              <p className="mt-2 text-green-600">Earn rewards for completing challenges!</p>
            </div>

            {/* Telemedicine */}
            <div className="bg-white p-4 rounded-lg shadow">
              <h2 className="text-xl font-semibold mb-2">Need a Doctor?</h2>
              <p>Book a virtual or in-person appointment.</p>
              <button 
                onClick={handleBookDoctor}
                className="mt-4 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
              >
                Book Now
              </button>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<WellnessDashboard />, document.getElementById("root"));
  </script>
</body>
</html>
